<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHITHARA — Soaring Quality. Trusted Delivery.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C8932F;--gold-dk:#9A6E1A;--gold-lt:#E8C97A;
  --brown:#2E1A0E;--brown-mid:#5C3A1E;
  --cream:#FAF6EE;--cream-dk:#F0E8D5;
  --line:#E2D5BC;--muted:#8B7355;
  --ink:#1A0D05;--success:#1A6B3A;--danger:#A8260E;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6}
.serif{font-family:'Playfair Display',serif}
.mono{font-variant-numeric:tabular-nums}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--cream-dk)}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.wrap{max-width:1340px;margin:0 auto;padding:0 20px}
@media(max-width:600px){.wrap{padding:0 14px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:.02em;padding:12px 26px;border-radius:999px;transition:all .2s;cursor:pointer;border:none;white-space:nowrap;text-decoration:none}
.btn-gold{background:var(--gold);color:var(--brown)}
.btn-gold:hover{background:var(--gold-dk);color:var(--cream);transform:translateY(-1px);box-shadow:0 8px 28px rgba(154,110,26,.35)}
.btn-dark{background:var(--brown);color:var(--gold-lt)}
.btn-dark:hover{background:var(--ink);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--brown);padding:10px 22px}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-dk)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.toast{position:fixed;top:84px;right:20px;background:var(--brown);color:var(--gold-lt);padding:13px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 12px 40px rgba(0,0,0,.28);border-left:3px solid var(--gold);animation:toastIn .2s ease;max-width:300px}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.topbar{background:var(--brown);color:rgba(250,246,238,.75);font-size:11px;letter-spacing:.04em;padding:7px 0}
.topbar-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.topbar a,.topbar span{cursor:pointer;transition:color .15s}
.topbar a:hover{color:var(--gold-lt)}
.topbar-links{display:flex;gap:18px}
.header{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.header-row{display:flex;align-items:center;gap:18px;padding:14px 0;min-height:74px}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;flex-shrink:0;text-decoration:none}
.logo-img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff}
.logo-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;letter-spacing:.15em;color:var(--ink);line-height:1}
.logo-tag{font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.search-bar{flex:1;max-width:580px;position:relative;display:flex;min-width:0}
.search-bar input{width:100%;padding:11px 16px 11px 42px;background:#fff;border:1.5px solid var(--line);border-radius:999px;font-size:14px;color:var(--ink);outline:none;transition:all .15s}
.search-bar input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,147,47,.12)}
.search-bar input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;width:18px;height:18px}
.header-actions{display:flex;align-items:center;gap:4px}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 13px;border-radius:8px;color:var(--brown);transition:all .15s;cursor:pointer;position:relative}
.hbtn:hover{background:var(--cream-dk)}
.hbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hbtn-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.badge{position:absolute;top:3px;right:4px;background:var(--gold);color:var(--brown);font-size:10px;font-weight:800;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media(max-width:640px){.hbtn-label,.logo-tag{display:none}}
.nav{background:var(--cream-dk);border-bottom:1px solid var(--line)}
.nav-row{display:flex;overflow-x:auto;scrollbar-width:none;gap:0}
.nav-row::-webkit-scrollbar{display:none}
.nav-link{padding:13px 16px;font-size:12px;font-weight:500;color:var(--brown-mid);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.01em}
.nav-link:hover{color:var(--ink)}
.nav-link.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.hero{background:linear-gradient(135deg,var(--brown) 0%,#4A2810 55%,var(--gold-dk) 100%);color:var(--cream);overflow:hidden;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 15% 60%,rgba(200,147,47,.2) 0,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(232,201,122,.15) 0,transparent 45%);pointer-events:none}
.hero-inner{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;padding:72px 0;position:relative;z-index:1}
@media(max-width:880px){.hero-inner{grid-template-columns:1fr;gap:32px;padding:44px 0;text-align:center}}
.hero-badge{display:inline-flex;align-items:center;gap:10px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-lt);margin-bottom:22px}
.hero-badge::before,.hero-badge::after{content:'';height:1px;width:28px;background:var(--gold-lt);opacity:.6}
@media(max-width:880px){.hero-badge{justify-content:center}}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(38px,5.5vw,72px);font-weight:500;line-height:1.06;letter-spacing:-.025em;margin-bottom:20px}
.hero h1 em{font-style:italic;color:var(--gold-lt);font-weight:400}
.hero-text{font-size:16px;line-height:1.65;opacity:.88;max-width:480px;margin-bottom:32px}
@media(max-width:880px){.hero-text{margin-left:auto;margin-right:auto}}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:880px){.hero-ctas{justify-content:center}}
.hero-img-wrap{display:flex;align-items:center;justify-content:center}
.hero-img{width:340px;height:340px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid rgba(200,147,47,.35);box-shadow:0 0 0 12px rgba(200,147,47,.08),0 30px 80px rgba(0,0,0,.4);animation:float 6s ease-in-out infinite}
@media(max-width:880px){.hero-img{width:220px;height:220px}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sec{padding:72px 0}
@media(max-width:640px){.sec{padding:48px 0}}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px;gap:16px;flex-wrap:wrap}
.sec-eyebrow{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:8px}
.sec-title{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,48px);font-weight:500;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.sec-title em{font-style:italic;color:var(--gold-dk)}
.sec-more{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dk);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sec-more:hover{color:var(--brown)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.cat-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:all .22s;text-align:center}
.cat-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 10px 30px rgba(46,26,14,.08)}
.cat-emoji{font-size:30px;line-height:1}
.cat-name{font-size:12px;font-weight:600;color:var(--brown)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
@media(max-width:520px){.prod-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .22s;display:flex;flex-direction:column;position:relative}
.pcard:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 40px rgba(46,26,14,.1)}
.pcard-img{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:18px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--cream) 0%,var(--cream-dk) 100%)}
.pcard-img img{max-width:100%;max-height:100%;object-fit:contain;position:relative;z-index:1;transition:transform .4s ease}
.pcard:hover .pcard-img img{transform:scale(1.06)}
.pcard-img-icon{font-size:64px;line-height:1;position:relative;z-index:1}
.pcard-badge{position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:4px;z-index:2}
.badge-best{background:var(--gold);color:var(--brown)}
.badge-new{background:#1A6B3A;color:#fff}
.badge-sale{background:var(--danger);color:#fff}
.badge-soon{background:#5C3A1E;color:var(--gold-lt)}
.pcard-wish{position:absolute;top:8px;right:8px;width:32px;height:32px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .15s}
.pcard-wish:hover{transform:scale(1.12)}
.pcard-wish svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:all .15s}
.pcard-wish.on svg{stroke:var(--danger);fill:var(--danger)}
.pcard-info{padding:14px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard-brand{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dk)}
.pcard-title{font-size:13px;font-weight:500;color:var(--brown);line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.pcard-rating{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.stars{color:var(--gold);font-size:11px;letter-spacing:.5px}
.pcard-price{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:2px}
.price-now{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.015em}
.price-was{font-size:12px;color:var(--muted);text-decoration:line-through}
.price-off{font-size:11px;color:var(--danger);font-weight:700}
.pcard-ship{font-size:11px;color:var(--success);font-weight:500;margin-top:1px}
.pcard-coming{font-size:11px;color:var(--gold-dk);font-weight:600;margin-top:1px;font-style:italic}
.editorial{background:linear-gradient(135deg,var(--brown) 0%,#4A2810 100%);border-radius:22px;padding:60px 40px;text-align:center;color:var(--cream);position:relative;overflow:hidden}
.editorial::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(200,147,47,.18) 0,transparent 60%);pointer-events:none}
.editorial-inner{position:relative;z-index:1;max-width:580px;margin:0 auto}
.editorial h2{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,44px);font-weight:500;letter-spacing:-.02em;line-height:1.15;margin-bottom:16px}
.editorial h2 em{font-style:italic;color:var(--gold-lt)}
.editorial p{font-size:15px;line-height:1.7;opacity:.86;margin-bottom:28px}
@media(max-width:640px){.editorial{padding:40px 24px}}
.trust{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0}
.trust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.trust-item{display:flex;align-items:center;gap:12px}
.trust-icon{width:38px;height:38px;border-radius:50%;background:var(--cream-dk);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.trust-icon svg{width:18px;height:18px;stroke:var(--gold-dk);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.trust-title{font-weight:700;font-size:13px;color:var(--ink)}
.trust-text{font-size:11px;color:var(--muted)}
.footer{background:var(--brown);color:var(--cream);padding:60px 0 28px;margin-top:72px}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr 1fr;gap:28px}}
@media(max-width:480px){.footer-grid{grid-template-columns:1fr}}
.footer-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.footer-logo img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:#fff}
.footer-logo-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.15em;color:var(--gold-lt)}
.footer-desc{font-size:13px;line-height:1.65;color:rgba(250,246,238,.65);max-width:280px;margin-bottom:14px}
.footer-contact{font-size:12px;line-height:1.7;color:rgba(250,246,238,.7);margin-bottom:14px}
.footer-socials{display:flex;gap:10px;margin-top:10px}
.footer-social{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(232,201,122,.08);transition:all .2s;color:var(--gold-lt);cursor:pointer}
.footer-social:hover{background:var(--gold);color:var(--brown)}
.footer-social svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.footer-h{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-lt);margin-bottom:16px}
.footer-links{display:flex;flex-direction:column;gap:9px}
.footer-link{font-size:13px;color:rgba(250,246,238,.65);cursor:pointer;transition:color .15s}
.footer-link:hover{color:var(--gold-lt)}
.footer-bottom{border-top:1px solid rgba(232,201,122,.12);padding-top:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:11px;color:rgba(250,246,238,.42)}
.footer-legal{font-size:10px;color:rgba(250,246,238,.38);margin-top:10px;line-height:1.6;border-top:1px solid rgba(232,201,122,.08);padding-top:14px}
.pdp-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding-bottom:64px;align-items:start}
@media(max-width:860px){.pdp-grid{grid-template-columns:1fr;gap:28px}}
.pdp-gallery{position:sticky;top:100px}
@media(max-width:860px){.pdp-gallery{position:static}}
.pdp-main{aspect-ratio:1;background:linear-gradient(135deg,var(--cream) 0%,var(--cream-dk) 100%);border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:40px;overflow:hidden}
.pdp-main img{max-width:100%;max-height:100%;object-fit:contain}
.pdp-main-icon{font-size:130px;line-height:1}
.pdp-thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.pdp-thumbs::-webkit-scrollbar{display:none}
.pdp-thumb{width:68px;height:68px;border-radius:8px;border:2px solid var(--line);background:var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;flex-shrink:0;transition:border-color .15s}
.pdp-thumb.on{border-color:var(--gold)}
.pdp-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.pdp-brand{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:6px}
.pdp-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:500;line-height:1.18;color:var(--ink);margin-bottom:12px;letter-spacing:-.02em}
.pdp-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:18px}
.pdp-meta strong{color:var(--ink);font-weight:600}
.divider{height:1px;background:var(--line);margin:18px 0}
.pdp-price-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pdp-price{font-family:'Playfair Display',serif;font-size:38px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.pdp-was{font-size:17px;color:var(--muted);text-decoration:line-through}
.pdp-save{font-size:13px;color:var(--success);font-weight:700}
.pdp-tax{font-size:11px;color:var(--muted);margin-bottom:22px}
.label-sm{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brown-mid);margin-bottom:9px}
.variants{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.vpill{padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:#fff;color:var(--brown);cursor:pointer;transition:all .15s}
.vpill:hover{border-color:var(--gold-lt)}
.vpill.on{background:var(--brown);color:var(--gold-lt);border-color:var(--brown)}
.bullets{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.bullet{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:var(--brown);line-height:1.5}
.bullet-icon{color:var(--gold);flex-shrink:0;margin-top:2px;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stock-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;margin-bottom:18px}
.stock-in{background:rgba(26,107,58,.1);color:var(--success)}
.stock-low{background:rgba(168,38,14,.1);color:var(--danger)}
.stock-out{background:#f3f4f6;color:#6b7280}
.stock-soon{background:rgba(200,147,47,.15);color:var(--gold-dk)}
.buybox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.delivery-row{background:var(--cream);border-radius:8px;padding:11px 13px;display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:14px}
.delivery-row strong{color:var(--success);font-weight:700}
.qty-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{width:34px;height:34px;font-size:16px;font-weight:700;color:var(--brown);transition:background .15s;display:flex;align-items:center;justify-content:center}
.qty button:hover{background:var(--cream-dk)}
.qty span{padding:0 14px;font-weight:700;min-width:40px;text-align:center;font-size:14px}
.buybox-meta{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--muted);padding-top:14px;border-top:1px solid var(--line);margin-top:14px}
.buybox-meta span{display:flex;align-items:center;gap:7px}
.buybox-meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.breadcrumb{font-size:12px;color:var(--muted);padding:22px 0;letter-spacing:.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.breadcrumb span{cursor:pointer;transition:color .15s}
.breadcrumb span:hover{color:var(--gold-dk)}
.breadcrumb .current{color:var(--ink)}
.breadcrumb .sep{opacity:.4}
.cart-page{padding:0 0 64px}
.cart-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
@media(max-width:860px){.cart-grid{grid-template-columns:1fr}}
.citem{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.citem-img{width:80px;height:80px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;padding:7px;flex-shrink:0}
.citem-img img,.citem-img .ci{max-width:100%;max-height:100%;object-fit:contain}
.citem-img .ci{font-size:42px}
.citem-info{flex:1;min-width:0}
.citem-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px;line-height:1.35}
.citem-variant{font-size:12px;color:var(--muted);margin-bottom:5px}
.citem-stock{font-size:11px;color:var(--success);font-weight:600}
.citem-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.citem-price{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink)}
.citem-remove{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none}
.citem-remove:hover{color:var(--danger)}
.summary-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;position:sticky;top:100px}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--brown-mid);margin-bottom:9px}
.sum-row strong{color:var(--ink);font-weight:700}
.sum-div{height:1px;background:var(--line);margin:13px 0}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.sum-total-label{font-size:14px;font-weight:700;color:var(--ink)}
.sum-total-val{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:var(--ink)}
.progress-bar{background:rgba(200,147,47,.15);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--gold-dk);font-weight:600;margin-bottom:13px}
.progress-track{height:5px;background:rgba(200,147,47,.2);border-radius:99px;margin-top:7px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.ssl-note{font-size:11px;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:10px}
.ssl-note svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.checkout-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;padding-bottom:64px}
@media(max-width:860px){.checkout-grid{grid-template-columns:1fr}}
.co-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:14px}
.co-h{font-family:'Playfair Display',serif;font-size:21px;font-weight:500;color:var(--ink);margin-bottom:18px;letter-spacing:-.01em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}}
.fg2{grid-column:1/-1}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink);outline:none;background:#fff;transition:all .15s;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,147,47,.1)}
.demo-note{background:var(--cream);border-radius:7px;padding:10px 13px;font-size:12px;color:var(--gold-dk);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.demo-note svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.success-wrap{text-align:center;padding:80px 16px;max-width:520px;margin:0 auto}
.success-icon{width:82px;height:82px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.success-icon svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.success-h{font-family:'Playfair Display',serif;font-size:40px;font-weight:500;letter-spacing:-.02em;margin-bottom:12px}
.success-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:left;margin:22px 0}
.admin-wrap{padding:28px 0 64px}
.admin-h{font-family:'Playfair Display',serif;font-size:30px;font-weight:500;color:var(--ink);margin-bottom:4px}
.admin-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.kpi-icon{font-size:22px;margin-bottom:5px}
.kpi-val{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.admin-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.admin-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.admin-tabs::-webkit-scrollbar{display:none}
.atab{padding:13px 18px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;transition:all .15s}
.atab.on{color:var(--ink);border-bottom-color:var(--gold)}
.atab:hover:not(.on){color:var(--brown)}
.admin-body{padding:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 11px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--cream);white-space:nowrap}
td{padding:11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pill-green{background:rgba(26,107,58,.12);color:var(--success)}
.pill-red{background:rgba(168,38,14,.1);color:var(--danger)}
.pill-grey{background:var(--cream-dk);color:var(--muted)}
.pill-gold{background:rgba(200,147,47,.15);color:var(--gold-dk)}
.admin-login{max-width:420px;margin:80px auto;padding:0 16px}
.al-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px;text-align:center}
.empty{text-align:center;padding:80px 20px;background:#fff;border:1px solid var(--line);border-radius:14px}
.empty-icon{font-size:44px;opacity:.3;margin-bottom:14px}
.empty-h{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;color:var(--ink);margin-bottom:8px}
.empty-p{font-size:14px;color:var(--muted);margin-bottom:22px}
.plp-wrap{padding:0 0 64px}
.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.review-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.review-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.review-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--brown);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.review-title{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:5px}
.review-body{font-size:13px;color:var(--brown-mid);line-height:1.6}
.legal-page{max-width:820px;margin:0 auto;padding:24px 0 80px}
.legal-page h1{font-family:'Playfair Display',serif;font-size:clamp(32px,4vw,52px);font-weight:500;letter-spacing:-.02em;line-height:1.1;color:var(--ink);margin:14px 0 8px}
.legal-page h1 em{font-style:italic;color:var(--gold-dk)}
.legal-page .updated{font-size:12px;color:var(--muted);margin-bottom:30px;letter-spacing:.04em}
.legal-page h2{font-family:'Playfair Display',serif;font-size:24px;font-weight:500;color:var(--ink);margin:32px 0 12px;letter-spacing:-.01em}
.legal-page h3{font-size:16px;font-weight:700;color:var(--ink);margin:24px 0 8px}
.legal-page p{font-size:15px;color:var(--brown-mid);line-height:1.75;margin-bottom:14px}
.legal-page ul{margin:10px 0 14px 22px}
.legal-page li{font-size:15px;color:var(--brown-mid);line-height:1.7;margin-bottom:6px}
.legal-page strong{color:var(--ink);font-weight:600}
.legal-page a{color:var(--gold-dk);text-decoration:underline}
.legal-page a:hover{color:var(--brown)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:20px}
@media(max-width:780px){.contact-grid{grid-template-columns:1fr}}
.contact-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px}
.contact-block{display:flex;gap:14px;align-items:flex-start;margin-bottom:22px}
.contact-icon{width:42px;height:42px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-icon svg{width:18px;height:18px;stroke:var(--gold-dk);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.contact-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.contact-val{font-size:14px;color:var(--ink);font-weight:500;line-height:1.5}
.contact-val a{color:var(--gold-dk);text-decoration:none;font-weight:600}
.contact-val a:hover{color:var(--brown)}
.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:30px}
.help-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;cursor:pointer;transition:all .22s}
.help-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 10px 26px rgba(46,26,14,.08)}
.help-card h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:500;color:var(--ink);margin-bottom:8px}
.help-card p{font-size:13px;color:var(--muted);line-height:1.6}
.faq-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:10px;cursor:pointer}
.faq-q{font-size:15px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:14px}
.faq-a{font-size:14px;color:var(--brown-mid);line-height:1.7;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:none}
.faq-item.open .faq-a{display:block}
.faq-item.open .faq-chevron{transform:rotate(180deg)}
.faq-chevron{transition:transform .2s;flex-shrink:0}

</style>

  const inStock = p.variants.some(v=>v.stock>0);
  const isComing = p.badge === 'soon';
  const disc = p.mrp > 0 ? discount(p.price, p.mrp) : 0;
  const wished = wishlist.includes(p.id);

function App() {
  const [view,setView] = useState('home');
  const [selProduct,setSelProduct] = useState(null);
  const [cat,setCat] = useState(null);
  const [q,setQ] = useState('');
  const [cart,setCart] = useState([]);
  const [wishlist,setWishlist] = useState([]);
  const [orders,setOrders] = useState([]);
  const [adminIn,setAdminIn] = useState(false);
  const [toastMsg,setToastMsg] = useState(null);
  const [orderConfirm,setOrderConfirm] = useState(null);

  const cartN = cart.reduce((s,i)=>s+i.qty,0);
  const toast = msg => {setToastMsg(msg);setTimeout(()=>setToastMsg(null),2500)};
  
  const nav = (v,c=null) => {
    setView(v);
    if(c!==null) setCat(c);
    if(v!=='plp') setQ('');
    window.scrollTo(0,0);
  };

  const onSelect = p => {setSelProduct(p);nav('pdp')};
  const onWish = id => {
    const had = wishlist.includes(id);
    setWishlist(w=>had?w.filter(x=>x!==id):[...w,id]);
    toast(had?'Removed from wishlist':'Saved to wishlist ❤');
  };
  const onPlace = (d,items,total) => {
    const num = `CHT-${Date.now().toString().slice(-5)}`;
    const order = {num,date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),customer:`${d.fn} ${d.ln}`,total,status:'Processing'};
    setOrders(o=>[order,...o]);
    setOrderConfirm(order);
    setCart([]);
    nav('success');
  };

  return (
    <div>
      {toastMsg && <div className="toast">{toastMsg}</div>}
      <Header cartN={cartN} wishN={wishlist.length} q={q} setQ={setQ} nav={nav} adminIn={adminIn}/>
      {view==='home' && <Home products={PRODUCTS} wishlist={wishlist} onSelect={onSelect} onWish={onWish} nav={nav}/>}
      {view==='plp' && <PLP products={PRODUCTS} cat={cat} q={q} onSelect={onSelect} wishlist={wishlist} onWish={onWish} nav={nav} setCat={setCat}/>}
      {view==='pdp' && <PDP product={selProduct} nav={nav} setCart={setCart} wishlist={wishlist} onWish={onWish} toast={toast}/>}
      {view==='cart' && <Cart cart={cart} products={PRODUCTS} setCart={setCart} nav={nav}/>}
      {view==='checkout' && <Checkout cart={cart} products={PRODUCTS} onPlace={onPlace} nav={nav}/>}
      {view==='success' && <Success order={orderConfirm} nav={nav}/>}
      {view==='wishlist' && <Wishlist wishlist={wishlist} products={PRODUCTS} onSelect={onSelect} onWish={onWish} nav={nav}/>}
      {view==='admin-login' && <AdminLogin onLogin={()=>{setAdminIn(true);nav('admin')}}/>}
      {view==='admin' && adminIn && <Admin products={PRODUCTS} orders={orders} onLogout={()=>{setAdminIn(false);nav('home')}} toast={toast}/>}
      {view==='about' && <About nav={nav}/>}
      {view==='story' && <Story nav={nav}/>}
      {view==='contact' && <Contact nav={nav}/>}
      {view==='help' && <Help nav={nav}/>}
      {view==='returns' && <Returns nav={nav}/>}
      {view==='terms' && <Terms nav={nav}/>}
      {view==='privacy' && <Privacy nav={nav}/>}
      {view==='cookies' && <Cookies nav={nav}/>}
      <Footer nav={nav}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
